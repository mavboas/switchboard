[project]
name = "switchboard-example-agents"
version = "0.1.0"
description = "Conectores MCP (simulador de crédito, chamados) e agentes A2A (análise de crédito, risco) de exemplo"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "switchboard-agentkit",
    "uvicorn>=0.30",
]

[tool.uv.sources]
switchboard-agentkit = { workspace = true }

[project.scripts]
switchboard-agent = "switchboard_agents.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_agents"]
