[project]
name = "switchboard-example-agents"
version = "0.1.0"
description = "Agentes MCP de exemplo (simulador de crédito e central de chamados) para demonstrar a delegação"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "uvicorn>=0.30",
]

[project.scripts]
switchboard-agent = "switchboard_agents.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_agents"]
