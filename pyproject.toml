# Raiz do monorepo (uv workspace). Não é um pacote publicável: só agrega os
# membros para desenvolvimento local (`uv sync` instala tudo) e concentra a
# configuração de lint e testes.
[project]
name = "switchboard-workspace"
version = "0.1.0"
description = "Monorepo do Switchboard: roteador de agentes com RAG e delegação via MCP"
requires-python = ">=3.11"
dependencies = [
    "switchboard-core",
    "switchboard-router",
    "switchboard-console",
    "switchboard-example-agents",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/router", "apps/console", "examples/agents"]

[tool.uv.sources]
switchboard-core = { workspace = true }
switchboard-router = { workspace = true }
switchboard-console = { workspace = true }
switchboard-example-agents = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "packages/core/tests",
    "apps/router/tests",
    "apps/console/tests",
    "examples/agents/tests",
]
addopts = "-ra --import-mode=importlib"
markers = [
    "postgres: exige um PostgreSQL com pgvector (SWITCHBOARD_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "B008", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["switchboard", "switchboard_router", "switchboard_console", "switchboard_agents"]
