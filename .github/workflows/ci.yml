name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchboard -d switchboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SWITCHBOARD_TEST_DATABASE_URL: postgresql://switchboard:switchboard@localhost:5432/switchboard_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - run: uv run pytest -q

  compose-smoke:
    # sobe a stack inteira como o usuário faria e testa cada rota de ponta a ponta:
    # RAG, tool MCP, agente A2A rápido, agente A2A demorado (pending → consolidação
    # por push notification) e contrato que pede entrada no meio (needs_input)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke ponta a ponta
        run: python3 scripts/smoke.py --router http://localhost:8080 --console http://localhost:8000
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
