[project]
name = "switchboard-console"
version = "0.1.0"
description = "Console (control plane): monólito com UI e API admin para configurar modelos, agentes, bases e roteadores"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "switchboard-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
switchboard-console = "switchboard_console.__main__:main"

[tool.uv.sources]
switchboard-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_console"]
