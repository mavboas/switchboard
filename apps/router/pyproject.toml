[project]
name = "switchboard-router"
version = "0.1.0"
description = "Serviço do roteador (data plane): API de chat e endpoint compatível com OpenAI"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "switchboard-core",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
switchboard-router = "switchboard_router.__main__:main"

[tool.uv.sources]
switchboard-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_router"]
